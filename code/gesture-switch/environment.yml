# Environment for code/gesture-switch. Create it FROM THIS FOLDER (the editable install path is relative):
#   conda env create -f environment.yml && conda activate frugalai-gesture-switch
# Or, without conda:  python -m venv .venv  and  pip install -r requirements.txt
# Versions are those installed in the author's env genai (Python 3.10.19), read on 2026-11-14.
# That env has not been rebuilt from this file yet, so treat it as unverified until someone does.
# On a Raspberry Pi use the system packages instead (sudo apt install python3-opencv python3-numpy);
# see PI_RECIPE.md. The hand models are not a pip package; see README.md (FRUGALAI_HAND_MODELS).
name: frugalai-gesture-switch
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytest=9.0.2
  - numpy=1.26.4
  - pip:
      - opencv-python-headless==4.11.0.86
