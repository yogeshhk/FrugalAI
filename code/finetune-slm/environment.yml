# Environment for code/finetune-slm. Create it FROM THIS FOLDER (the editable install path is relative):
#   conda env create -f environment.yml && conda activate frugalai-finetune-slm
# Or, without conda:  python -m venv .venv  and  pip install -r requirements.txt
# Versions are those installed in the author's env genai (Python 3.10.19), read on 2026-11-14.
# That env has not been rebuilt from this file yet, so treat it as unverified until someone does.
# LoRA training on the CPU. The first training run downloads SmolLM2-135M-Instruct (see the README).
name: frugalai-finetune-slm
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytest=9.0.2
  - numpy=1.26.4
  - psutil=5.9.5
  - pip:
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.7.1+cpu
      - transformers==4.57.3
      - peft==0.18.0
      - rank-bm25==0.2.2
      - -e ../common
