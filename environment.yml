name: frugalai
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytest
  - psutil
  - pyyaml
  - requests
  - scipy
  - ffmpeg          # voice-form: decodes phone recordings
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - watchdog
      - chromadb
      - sentence-transformers
      - torch
      - transformers
      - peft
      - langgraph
      - pydantic
      - vosk          # voice-form: small offline speech model runtime
